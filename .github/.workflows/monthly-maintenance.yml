name: Monthly Maintenance Audit

on:
  schedule:
    - cron: "0 3 1 * *" # Run at 03:00 UTC on the first day of the month
  workflow_dispatch:

jobs:
  generate-maintenance-tasks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Launch Cursor background agent for maintenance audit
        env:
          CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
          REPO: ${{ github.repository }}
          ENABLE_OPENAI_DEEP_RESEARCH: ${{ vars.ENABLE_OPENAI_DEEP_RESEARCH || 'false' }}
          ENABLE_PERPLEXITY_SEARCH: ${{ vars.ENABLE_PERPLEXITY_SEARCH || 'false' }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_RESEARCH_PROJECT_ID: ${{ vars.OPENAI_RESEARCH_PROJECT_ID }}
          PERPLEXITY_API_KEY: ${{ secrets.PERPLEXITY_API_KEY }}
        run: ./.github/scripts/run-monthly-maintenance-audit.sh