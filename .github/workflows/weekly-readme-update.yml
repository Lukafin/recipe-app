name: Weekly README Update

on:
  schedule:
    - cron: "0 0 * * 0" # Every Sunday at 00:00 UTC
  workflow_dispatch:

jobs:
  update-readmes:
    runs-on: ubuntu-latest
    steps:
      - name: Launch Cursor background agent
        env:
          CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
          REPO: ${{ github.repository }}
        run: |
          JSON=$(jq -n --arg repo "https://github.com/$REPO" \
                         --arg prompt "Check all commits merged into the main branch in the past week and update README.md to reflect recent code changes." \
                         '{model:"gpt-5",prompt:{text:$prompt},source:{repository:$repo,ref:"main"},target:{autoCreatePr:true}}')
          curl --request POST \
            --url https://api.cursor.com/v0/agents \
            --header "Authorization: Bearer ${CURSOR_API_KEY}" \
            --header "Content-Type: application/json" \
            --data "$JSON"
